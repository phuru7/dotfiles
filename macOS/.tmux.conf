#Action key
unbind C-b
set-option -g prefix C-a
set-option -g repeat-time 0
set-option -g focus-events on

#Split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with Alt+keys
bind-key -n M-I select-pane -U    # Alt+i up
bind-key -n M-K select-pane -D    # Alt+k down
bind-key -n M-l select-pane -R    # Alt+l right
bind-key -n M-j select-pane -L    # Alt+j left

# Resize panes with Prefix+keys
bind-key i resize-pane -U 5      # Ctrl+a i enlarge upward
bind-key k resize-pane -D 5      # Ctrl+a k enlarge downward
bind-key l resize-pane -R 5      # Ctrl+a l enlarge rightward
bind-key j resize-pane -L 5      # Ctrl+a j enlarge leftward

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

##Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# Increase history limit
set -g history-limit 10000 

# Enable mouse mode
set -g mouse on

# Renumber windows when one is closed
set -g renumber-windows on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Visual customization
set -g status-style bg=black,fg=white
set -g window-status-current-style bg=green,fg=black,bold
set -g status-left "#[bg=black,fg=white]#S "
set -g status-right "#[fg=cyan]%d %b %R"